<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card 1 – Left – Cyan -->
  <g transform="rotate(-20, 256, 460)" filter="url(#glow-cyan)">
    <rect x="181" y="180" width="150" height="200" rx="14" ry="14" fill="#050510" stroke="#00dcff" stroke-width="4"/>
    <text x="201" y="215" fill="#00dcff" font-family="monospace" font-size="28" font-weight="bold">7</text>
    <text x="256" y="320" fill="#00dcff" font-family="monospace" font-size="90" font-weight="bold" text-anchor="middle" dominant-baseline="middle">7</text>
  </g>

  <!-- Card 2 – Middle – Gold -->
  <g transform="rotate(0, 256, 460)" filter="url(#glow-gold)">
    <rect x="181" y="180" width="150" height="200" rx="14" ry="14" fill="#050510" stroke="#FFD700" stroke-width="4"/>
    <text x="201" y="215" fill="#FFD700" font-family="monospace" font-size="28" font-weight="bold">7</text>
    <text x="256" y="320" fill="#FFD700" font-family="monospace" font-size="90" font-weight="bold" text-anchor="middle" dominant-baseline="middle">7</text>
  </g>

  <!-- Card 3 – Right – Green -->
  <g transform="rotate(20, 256, 460)" filter="url(#glow-green)">
    <rect x="181" y="180" width="150" height="200" rx="14" ry="14" fill="#050510" stroke="#39ff14" stroke-width="4"/>
    <text x="201" y="215" fill="#39ff14" font-family="monospace" font-size="28" font-weight="bold">7</text>
    <text x="256" y="320" fill="#39ff14" font-family="monospace" font-size="90" font-weight="bold" text-anchor="middle" dominant-baseline="middle">7</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
</defs>

<!-- Pixel art "3" — neon violet -->
  <g fill="#cc00ff" filter="url(#glow)">
    <!-- Row 0: # # # -->
    <rect x="27" y="11" width="14" height="14"/>
    <rect x="43" y="11" width="14" height="14"/>
    <rect x="59" y="11" width="14" height="14"/>
    <!-- Row 1:     # -->
    <rect x="59" y="27" width="14" height="14"/>
    <!-- Row 2: # # # -->
    <rect x="27" y="43" width="14" height="14"/>
    <rect x="43" y="43" width="14" height="14"/>
    <rect x="59" y="43" width="14" height="14"/>
    <!-- Row 3:     # -->
    <rect x="59" y="59" width="14" height="14"/>
    <!-- Row 4: # # # -->
    <rect x="27" y="75" width="14" height="14"/>
    <rect x="43" y="75" width="14" height="14"/>
    <rect x="59" y="75" width="14" height="14"/>
  </g>
</svg>

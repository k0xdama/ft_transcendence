services:
  db:
    image: postgres:18-alpine
    container_name: postgres
    pull_policy: never
    environment:
      POSTGRES_DB_FILE: /run/secrets/psql_dbname
      POSTGRES_USER_FILE: /run/secrets/psql_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/psql_admin_passwd
    secrets:
      - psql_dbname
      - psql_admin_user
      - psql_admin_passwd
      - psql_services_passwd
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/psql_admin_user) -d $(cat /run/secrets/psql_dbname)"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - transcendence_network
    restart: unless-stopped

  cache:
    image: redis:8.4.0-alpine
    container_name: redis
    pull_policy: never
    secrets:
      - redis_passwd
    build:
      context: ./redis
      dockerfile: Dockerfile
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_passwd) ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - transcendence_network
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:

secrets:
  psql_dbname:
    file: ./secrets/psql_dbname.txt
  psql_admin_user:
    file: ./secrets/psql_admin_user.txt
  psql_admin_passwd:
    file: ./secrets/psql_admin_passwd.txt
  psql_services_passwd:
    file: ./secrets/psql_services_passwd.txt
  redis_passwd:
    file: ./secrets/redis_passwd.txt
  jwt_access_secret:
    file: ./secrets/jwt_access_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt

networks:
  transcendence_network:
    driver: bridge

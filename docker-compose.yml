  psql_admin_user:
    file: ./secrets/psql_admin_user.txt
  psql_admin_passwd:
    file: ./secrets/psql_admin_passwd.txt
  psql_services_passwd:
    file: ./secrets/psql_services_passwd.txt
  # psql_auth_passwd:
  #   file: ./secrets/psql_auth_passwd.txt
  # psql_player_passwd:
  #   file: ./secrets/psql_player_passwd.txt
  # psql_lobby_passwd:
  #   file: ./secrets/psql_lobby_passwd.txt
  # psql_game_passwd:
  #   file: ./secrets/psql_game_passwd.txt 
  # psql_chat_passwd:
  #   file: ./secrets/psql_chat_passwd.txt
  redis_passwd:
    file: ./secrets/redis_passwd.txt
  jwt_access:
    file: ./secrets/jwt_access.txt
  # service_token:
  #   file:./secrets/service_token.txt

networks:
  trio_network:
    driver: bridge

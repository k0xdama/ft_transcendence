services:
  db:
    image: postgres:18-v1
    container_name: postgres
    pull_policy: never
    environment:
      POSTGRES_DB_FILE: /run/secrets/psql_dbname
      POSTGRES_USER_FILE: /run/secrets/psql_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/psql_admin_passwd
    secrets:
      - psql_dbname
      - psql_admin_user
      - psql_admin_passwd
      - psql_services_passwd
      # - psql_auth_passwd
      # - psql_player_passwd
      # - psql_lobby_passwd
      # - psql_game_passwd
      # - psql_chat_passwd
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - trio_network
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $(cat /run/secrets/psql_admin_user) -d $(cat /run/secrets/psql_dbname) || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:8.4-v1
    container_name: redis
    pull_policy: never
    secrets:
      - redis_passwd
    build:
      context: ./redis
      dockerfile: Dockerfile
    volumes:
      - redis_data:/data
    networks:
      - trio_network
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_passwd) ping 2>/dev/null | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  gateway:
    image: gateway:v1
    container_name: gateway
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    secrets:
      - jwt_access
      - ssl_key
      - ssl_cert
    volumes:
      - ./backend/api-gateway/src:/app/src:ro
    networks:
      - trio_network
    ports:
      - "4000:4000" # Only backend entrypoint
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-check-certificate --spider -q https://localhost:4000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  auth:
    image: auth:v1
    container_name: auth
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - psql_dbname
      - psql_services_passwd
      # - psql_auth_passwd
      - jwt_access
      - ssl_key
      - ssl_cert
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    volumes:
      - ./backend/auth-service/src:/app/src:ro
    networks:
      - trio_network
    expose:
      - "3000" # Only accessible on trio_network
    restart: unless-stopped

  player:
    image: player:v1
    container_name: player
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - psql_dbname
      - psql_services_passwd
      # - psql_player_passwd
      - redis_passwd
      # - service_token
      - ssl_key
      - ssl_cert
    build:
      context: ./backend/player-service
      dockerfile: Dockerfile
    volumes:
      - ./backend/player-service/src:/app/src:ro
      - ./backend/player-service/uploads:/app/uploads
    networks:
      - trio_network
    expose:
      - "3001"
    restart: unless-stopped

  chat:
    image: chat:v1
    container_name: chat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - psql_dbname
      - psql_services_passwd
      # - psql_chat_passwd
      - redis_passwd
      - ssl_key
      - ssl_cert
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    volumes:
      - ./backend/chat-service/src:/app/src:ro
    networks:
      - trio_network
    expose:
      - "2000" # Only accessible on trio_network
    restart: unless-stopped

  lobby:
    image: lobby:v1
    container_name: lobby
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ./backend/lobby-service
      dockerfile: Dockerfile
    secrets:
      - redis_passwd
      - ssl_key
      - ssl_cert
    volumes:
      - ./backend/lobby-service/src:/app/src:ro
    networks:
      - trio_network
    expose:
      - "3003" # Only accessible on trio_network
    restart: unless-stopped

  game:
    image: game:v1
    container_name: game
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ./backend/game-service
      dockerfile: Dockerfile
    secrets:
      - redis_passwd
      - ssl_key
      - ssl_cert
    volumes:
      - ./backend/game-service/src:/app/src:ro
    networks:
      - trio_network
    expose:
      - "3002" # Only accessible on trio_network
    restart: unless-stopped

  frontend:
    image: frontend:v1
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    secrets:
      - ssl_key
      - ssl_cert
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
    networks:
      - trio_network
    ports:
      - "5173:5173"  # Dev client
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

secrets:
  psql_dbname:
    file: ./secrets/psql_dbname.txt
  psql_admin_user:
    file: ./secrets/psql_admin_user.txt
  psql_admin_passwd:
    file: ./secrets/psql_admin_passwd.txt
  psql_services_passwd:
    file: ./secrets/psql_services_passwd.txt
  # psql_auth_passwd:
  #   file: ./secrets/psql_auth_passwd.txt
  # psql_player_passwd:
  #   file: ./secrets/psql_player_passwd.txt
  # psql_lobby_passwd:
  #   file: ./secrets/psql_lobby_passwd.txt
  # psql_game_passwd:
  #   file: ./secrets/psql_game_passwd.txt 
  # psql_chat_passwd:
  #   file: ./secrets/psql_chat_passwd.txt
  redis_passwd:
    file: ./secrets/redis_passwd.txt
  jwt_access:
    file: ./secrets/jwt_access.txt
  ssl_key:
    file: ./secrets/ssl/key.pem
  ssl_cert:
    file: ./secrets/ssl/cert.pem

networks:
  trio_network:
    driver: bridge
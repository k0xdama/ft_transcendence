services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    image: backend:v1
    ports:
      - "5172:5172"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - transcendence_network
    environment:
      - NODE_ENV=development
      - PORT=5172
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    image: frontend:v1
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - transcendence_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  transcendence_network:
    driver: bridge

services:
  db:
    image: postgres:18-v1
    container_name: postgres
    pull_policy: never
    environment:
      POSTGRES_DB_FILE: /run/secrets/psql_dbname
      POSTGRES_USER_FILE: /run/secrets/psql_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/psql_admin_passwd
    secrets:
      - psql_dbname
      - psql_admin_user
      - psql_admin_passwd
      - psql_services_passwd
      # - psql_auth_passwd
      # - psql_player_passwd
      # - psql_lobby_passwd
      # - psql_game_passwd
      # - psql_chat_passwd
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/psql_admin_user) -d $(cat /run/secrets/psql_dbname) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trio_network
    restart: unless-stopped

  redis:
    image: redis:8.4-v1
    container_name: redis
    pull_policy: never
    secrets:
      - redis_passwd
    build:
      context: ./redis
      dockerfile: Dockerfile
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_passwd) ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trio_network
    restart: unless-stopped

  auth:
    image: auth:v1
    container_name: auth
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # player:
      #   condition: service_started #rajout d'une dependance comme le auth/register fait appel a player/
    environment:
      - NODE_ENV=development
      - PLAYER_SERVICE_URL=http://player:3001 #rajout pour pas seulement ecrire en dur dans auth.js, c'est un test pour le moment
    secrets:
      - psql_dbname
      - psql_services_passwd
      # - psql_auth_passwd
      - jwt_access
#      - service_token #c'etait un test pour un token de header que je vais peut etre refaire
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    volumes:
      - ./backend/auth-service/src:/app/src:ro
    networks:
      - trio_network
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    image: backend:v1
    container_name: backend
    environment:
      - NODE_ENV=development
      - PORT=5172
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - trio_network
    ports:
      - "5172:5172"
    restart: unless-stopped

  frontend:
    image: frontend:v1
    container_name: frontend
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trio_network
    ports:
      - "5173:5173"
    restart: unless-stopped

  gateway:
    image: gateway:v1
    container_name: gateway
    depends_on:
      - backend
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile
    secrets:
      - jwt_access
    volumes:
      - /app/node_modules
    networks:
      - trio_network
    ports:
      - "4000:4000"
    restart: unless-stopped

  player:
    image: player:v1
    container_name: player
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - psql_dbname
      - psql_admin_user
      - psql_admin_passwd
      - psql_services_passwd
      - redis_passwd
#      - service_token
    build:
      context: ./backend/player-service
      dockerfile: Dockerfile
    volumes:
      - ./backend/player-service/src:/app/src:ro
      - ./backend/player-service/uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - trio_network
    restart: unless-stopped


services:
  db:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB_FILE: /run/secrets/psql_dbname
      POSTGRES_USER_FILE: /run/secrets/psql_admin_user
      POSTGRES_PASSWORD_FILE: /run/secrets/psql_admin_passwd
    secrets:
      - psql_dbname
      - psql_admin_user
      - psql_admin_passwd
      - psql_auth_user
      - psql_auth_passwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgreSQL/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myadmin -d transcendence_db|| exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - transcendence_network
    restart: unless-stopped

  cache:
    image: redis:8.4.0-alpine
    container_name: redis
    secrets:
      - redis_passwd
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_passwd) ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - transcendence_network
    restart: unless-stopped

  backend:
    image: backend:v1
    container_name: backend
    environment:
      - NODE_ENV=development
      - PORT=5172
    build: 
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - transcendence_network
    ports:
      - "5172:5172"
    restart: unless-stopped

  auth:
    image: auth:v1
    container_name: auth
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    secrets:
      - psql_dbname
      - psql_admin_user
      - psql_admin_passwd
      - psql_auth_user
      - psql_auth_passwd
      - redis_passwd
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    volumes:
      - ./backend/auth-service/src:/app/src:ro
    networks:
      - transcendence_network
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    image: frontend:v1
    container_name: frontend
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - transcendence_network
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

secrets:
  psql_dbname:
    file: ./secrets/psql_dbname.txt
  psql_admin_user:
    file: ./secrets/psql_admin_user.txt
  psql_admin_passwd:
    file: ./secrets/psql_admin_passwd.txt
  psql_auth_user:
    file: ./secrets/psql_auth_user.txt
  psql_auth_passwd:
    file: ./secrets/psql_auth_passwd.txt
  redis_passwd:
    file: ./secrets/redis_passwd.txt

networks:
  transcendence_network:
    driver: bridge

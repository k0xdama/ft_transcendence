<!DOCTYPE html>
<html>
<head>
    <title>Test Lobby + Game</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
        input, select { padding: 8px; margin: 5px; }
        #logs { background: #111; color: #0f0; padding: 15px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
        .section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Test Lobby + Game</h1>
    <div id="status">Déconnecté</div>

    <div class="section">
        <h2>Lobby</h2>
        <button onclick="createLobby()">Créer Lobby</button>
        <input id="joinCode" placeholder="Code lobby (6 chars)">
        <button onclick="joinLobby()">Rejoindre</button>
        <button onclick="toggleReady()">Ready / Pas Ready</button>
        <button onclick="startGame()">Lancer la partie</button>
    </div>

    <div class="section" id="gameSection" style="display:none">
        <h2>Game</h2>
        <p>Mon ID : <strong id="myId"></strong></p>
        <p>Tour de : <strong id="currentPlayer"></strong></p>
        <p>Action : <strong id="currentAction"></strong></p>

        <h3>Ma main</h3>
        <div id="hand"></div>

        <h3>Cartes du milieu</h3>
        <div id="middle"></div>

        <h3>Cartes révélées</h3>
        <div id="revealed"></div>

        <h3>Actions</h3>
        <select id="actionType">
            <option value="PLAYER_HIGHEST">ASK_HIGHEST</option>
            <option value="PLAYER_LOWEST">ASK_LOWEST</option>
            <option value="FLIP_MIDDLE">FLIP_MIDDLE</option>
        </select>
        <input id="actionTarget" placeholder="ID joueur ou position milieu" />
        <button onclick="sendAction()">Jouer</button>
    </div>

    <div id="logs"></div>

    <script>
        let currentLobbyId = null;
        let currentGameId = null;
        let lobbySocket = null;
        let gameSocket = null;

        function log(msg) {
            const el = document.getElementById('logs');
            el.textContent += new Date().toLocaleTimeString() + ' | ' + msg + '\n';
            el.scrollTop = el.scrollHeight;
        }

        // ========== LOBBY CONNECTION ==========

        lobbySocket = io('http://localhost:3001');

        lobbySocket.on('connect', () => {
            document.getElementById('status').innerText = '✅ Connecté au lobby — ' + lobbySocket.id;
            document.getElementById('myId').innerText = lobbySocket.id;
            log('Connecté au lobby-service');
        });

        lobbySocket.on('disconnect', () => {
            document.getElementById('status').innerText = '❌ Déconnecté du lobby';
            log('Déconnecté du lobby-service');
        });

        lobbySocket.on('lobby:created', (data) => {
            currentLobbyId = data.lobbyId;
            log('Lobby créé : ' + data.lobbyId);
        });

        lobbySocket.on('lobby:joined', (data) => {
            log('Joueur a rejoint — Users: ' + JSON.stringify(data.lobbyStruct.users));
        });

        lobbySocket.on('lobby:readyChanged', (data) => {
            log('Ready changé — Users: ' + JSON.stringify(data.lobbyStruct.users));
        });

        lobbySocket.on('lobby:disconnected', (data) => {
            log('Joueur déconnecté du lobby: ' + data.userId);
        });

        lobbySocket.on('lobby:gameStarting', (data) => {
            currentGameId = data.gameId;
            log('PARTIE LANCÉE — gameId: ' + data.gameId + ' — Connexion au game-service...');
            connectToGame(data.gameId);
        });

        lobbySocket.on('error', (msg) => {
            log('ERREUR LOBBY: ' + msg);
        });

        // ========== GAME CONNECTION ==========

        function connectToGame(gameId) {
            gameSocket = io('http://localhost:3002');

            gameSocket.on('connect', () => {
                log('Connecté au game-service — ' + gameSocket.id);
                gameSocket.emit('game:join', { gameId: gameId });
            });

            gameSocket.on('game:joined', (data) => {
                log('Rejoint la partie : ' + data.gameId);
            });

            gameSocket.on('game:started', (data) => {
                document.getElementById('gameSection').style.display = 'block';
                log('Partie démarrée !');
                updateUI(data.gameStruct);
            });

            gameSocket.on('game:update', (data) => {
                log('Update reçu');
                updateUI(data.gameStruct);
            });

            gameSocket.on('error', (msg) => {
                log('ERREUR GAME: ' + msg);
            });

            gameSocket.on('disconnect', () => {
                log('Déconnecté du game-service');
            });
        }

        // ========== LOBBY ACTIONS ==========

        function createLobby() {
            lobbySocket.emit('lobby:create', {
                gameMode: 'CLASSIC',
                gameType: 'SOLO',
                maxUsers: 3
            });
        }

        function joinLobby() {
            const code = document.getElementById('joinCode').value.trim();
            if (!code) { log('Entre un code lobby'); return; }
            currentLobbyId = code;
            lobbySocket.emit('lobby:join', { lobbyId: code });
        }

        function toggleReady() {
            if (!currentLobbyId) { log('Pas dans un lobby'); return; }
            lobbySocket.emit('lobby:ready', { lobbyId: currentLobbyId });
        }

        function startGame() {
            if (!currentLobbyId) { log('Pas dans un lobby'); return; }
            lobbySocket.emit('lobby:start', { lobbyId: currentLobbyId });
        }

        // ========== GAME ACTIONS ==========

        function sendAction() {
            if (!gameSocket || !currentGameId) { log('Pas en partie'); return; }
            const actionType = document.getElementById('actionType').value;
            const target = document.getElementById('actionTarget').value;
            gameSocket.emit('game:action', {
                gameId: currentGameId,
                actionType: actionType,
                target: target
            });
        }

        function updateUI(gameStruct) {
            document.getElementById('currentPlayer').innerText = gameStruct.currentPlayer;
            document.getElementById('currentAction').innerText = gameStruct.currentAction;

            const myId = gameSocket.id;
            const me = gameStruct.players.find(p => p.id === myId);
            if (me) {
                document.getElementById('hand').innerText =
                    me.hand.map(c => '[' + c.value + ']').join(' ');
            }

            document.getElementById('middle').innerText =
                gameStruct.cardsInMiddle.map((c, i) =>
                    c.revealed ? i + ':[' + c.value + ']' : i + ':[?]'
                ).join(' ');

            document.getElementById('revealed').innerText =
                gameStruct.cardsRevealed.map(c => '[' + c.value + ']').join(' ');
        }
    </script>
</body>
</html>

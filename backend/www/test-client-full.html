<!DOCTYPE html>
<html>
<head>
    <title>Test Lobby + Game + Matchmaking</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
        input, select { padding: 8px; margin: 5px; }
        #logs { background: #111; color: #0f0; padding: 15px; height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        h2 { margin-top: 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Test Lobby + Game + Matchmaking</h1>
    <div id="status">Déconnecté</div>

    <div class="section" id="authSection">
        <h2>Auth</h2>
        <input id="regEmail" placeholder="Email">
        <input id="regUsername" placeholder="Username">
        <input id="regPassword" placeholder="Password" type="password">
        <button onclick="register()">Register</button>
        <hr>
        <input id="loginId" placeholder="Email ou Username">
        <input id="loginPwd" placeholder="Password" type="password">
        <button onclick="login()">Login</button>
    </div>

    <div class="section hidden" id="lobbySection">
        <h2>Lobby — Partie privée</h2>
        <select id="createGameMode">
            <option value="CLASSIC">CLASSIC</option>
            <option value="LINKED">LINKED</option>
        </select>
        <select id="createGameType">
            <option value="SOLO">SOLO</option>
            <option value="TEAM_UP">TEAM_UP</option>
        </select>
        <select id="createMaxUsers">
            <option value="3">3 joueurs</option>
            <option value="4">4 joueurs</option>
            <option value="5">5 joueurs</option>
            <option value="6">6 joueurs</option>
        </select>
        <button onclick="createLobby()">Créer Lobby</button>
        <br>
        <input id="joinCode" placeholder="Code lobby (6 chars)">
        <button onclick="joinLobby()">Rejoindre</button>
        <button onclick="toggleReady()">Ready / Pas Ready</button>
        <button onclick="startGame()">Lancer la partie</button>

        <hr>
        <h2>Matchmaking</h2>
        <select id="mmGameMode">
            <option value="CLASSIC">CLASSIC</option>
            <option value="LINKED">LINKED</option>
        </select>
        <select id="mmGameType">
            <option value="SOLO">SOLO</option>
            <option value="TEAM_UP">TEAM_UP</option>
        </select>
        <select id="mmMaxUsers">
            <option value="3">3 joueurs</option>
            <option value="4">4 joueurs</option>
            <option value="5">5 joueurs</option>
            <option value="6">6 joueurs</option>
        </select>
        <button onclick="joinMatchmaking()">Trouver une partie</button>
        <button onclick="leaveMatchmaking()">Annuler recherche</button>
    </div>

    <div class="section hidden" id="gameSection">
        <h2>Game</h2>
        <p>Mon ID : <strong id="myId"></strong></p>
        <p>Username : <strong id="myUsername"></strong></p>
        <p>Tour de : <strong id="currentPlayer"></strong></p>
        <p>Action : <strong id="currentAction"></strong></p>

        <h3>Ma main</h3>
        <div id="hand"></div>

        <h3>Cartes du milieu</h3>
        <div id="middle"></div>

        <h3>Cartes révélées</h3>
        <div id="revealed"></div>

        <h3>Joueurs</h3>
        <div id="playersList"></div>

        <h3>Actions</h3>
        <select id="actionType">
            <option value="PLAYER_HIGHEST">ASK_HIGHEST</option>
            <option value="PLAYER_LOWEST">ASK_LOWEST</option>
            <option value="FLIP_MIDDLE">FLIP_MIDDLE</option>
        </select>
        <input id="actionTarget" placeholder="ID joueur ou position milieu" />
        <button onclick="sendAction()">Jouer</button>
    </div>

    <div id="logs"></div>

    <script>
        let token = null;
        let userId = null;
        let username = null;
        let currentLobbyId = null;
        let currentGameId = null;
        let lobbySocket = null;
        let gameSocket = null;

        const AUTH_URL = 'http://localhost:3000';
        const LOBBY_URL = 'http://localhost:3003';
        const GAME_URL = 'http://localhost:3002';

        function log(msg) {
            const el = document.getElementById('logs');
            el.textContent += new Date().toLocaleTimeString() + ' | ' + msg + '\n';
            el.scrollTop = el.scrollHeight;
        }

        // ========== AUTH ==========

        async function register() {
            try {
                const res = await fetch(AUTH_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('regEmail').value,
                        username: document.getElementById('regUsername').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                if (!res.ok) { log('ERREUR REGISTER: ' + data.error); return; }
                log('Compte créé : ' + data.user.username + ' — Maintenant login');
            } catch (e) {
                log('ERREUR REGISTER: ' + e.message);
            }
        }

        async function login() {
            try {
                const res = await fetch(AUTH_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: document.getElementById('loginId').value,
                        password: document.getElementById('loginPwd').value
                    })
                });
                const data = await res.json();
                if (!res.ok) { log('ERREUR LOGIN: ' + data.error); return; }
                token = data.accessToken;
                userId = data.user.id;
                username = data.user.username;
                log('Login OK — ' + username + ' (' + userId + ')');
                document.getElementById('myId').innerText = userId;
                document.getElementById('myUsername').innerText = username;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('lobbySection').classList.remove('hidden');
                connectToLobby();
            } catch (e) {
                log('ERREUR LOGIN: ' + e.message);
            }
        }

        // ========== LOBBY CONNECTION ==========

        function connectToLobby() {
            lobbySocket = io(LOBBY_URL, {
                auth: { token: token }
            });

            lobbySocket.on('connect', () => {
                document.getElementById('status').innerText = '✅ Connecté au lobby — ' + username;
                log('Connecté au lobby-service');
            });

            lobbySocket.on('connect_error', (err) => {
                log('ERREUR CONNEXION LOBBY: ' + err.message);
            });

            lobbySocket.on('disconnect', () => {
                document.getElementById('status').innerText = '❌ Déconnecté du lobby';
                log('Déconnecté du lobby-service');
            });

            lobbySocket.on('lobby:created', (data) => {
                currentLobbyId = data.lobbyId;
                log('Lobby créé : ' + data.lobbyId);
            });

            lobbySocket.on('lobby:joined', (data) => {
                const users = data.lobbyStruct.users.map(u => u.id.substring(0, 8) + (u.ready ? ' ✓' : ' ✗')).join(', ');
                log('Lobby update — Users: ' + users);
            });

            lobbySocket.on('lobby:readyChanged', (data) => {
                const users = data.lobbyStruct.users.map(u => u.id.substring(0, 8) + (u.ready ? ' ✓' : ' ✗')).join(', ');
                log('Ready changé — Users: ' + users);
            });

            lobbySocket.on('lobby:disconnected', (data) => {
                log('Joueur déconnecté du lobby: ' + data.userId.substring(0, 8));
            });

            lobbySocket.on('lobby:gameStarting', (data) => {
                currentGameId = data.gameId;
                log('PARTIE LANCÉE — gameId: ' + data.gameId.substring(0, 8) + ' — Connexion au game-service...');
                connectToGame(data.gameId);
            });

            lobbySocket.on('error', (msg) => {
                log('ERREUR LOBBY: ' + msg);
            });
        }

        // ========== GAME CONNECTION ==========

        function connectToGame(gameId) {
            gameSocket = io(GAME_URL, {
                auth: { token: token }
            });

            gameSocket.on('connect', () => {
                log('Connecté au game-service');
                gameSocket.emit('game:join', { gameId: gameId });
            });

            gameSocket.on('connect_error', (err) => {
                log('ERREUR CONNEXION GAME: ' + err.message);
            });

            gameSocket.on('game:joined', (data) => {
                log('Rejoint la partie : ' + data.gameId.substring(0, 8));
            });

            gameSocket.on('game:started', (data) => {
                document.getElementById('gameSection').classList.remove('hidden');
                log('Partie démarrée !');
                updateUI(data.gameStruct);
            });

            gameSocket.on('game:reconnected', (data) => {
                document.getElementById('gameSection').classList.remove('hidden');
                log('Reconnecté à la partie !');
                updateUI(data.gameStruct);
            });

            gameSocket.on('game:playerReconnected', (data) => {
                log('Joueur reconnecté: ' + data.userId.substring(0, 8));
            });

            gameSocket.on('game:playerDisconnected', (data) => {
                log('Joueur déconnecté: ' + data.userId.substring(0, 8) + ' — 30s pour revenir');
            });

            gameSocket.on('game:playerEliminated', (data) => {
                log('Joueur éliminé: ' + data.userId.substring(0, 8));
            });

            gameSocket.on('game:update', (data) => {
                log('Action: ' + data.action_result.actionDone + ' → ' + data.action_result.event);
                updateUI(data.gameStruct);
            });

            gameSocket.on('game:ended', (data) => {
                const isMe = data.winnerId === userId;
                log('=== PARTIE TERMINÉE === ' + (isMe ? 'VICTOIRE !' : 'Défaite...') + ' — Raison: ' + data.reason);
            });

            gameSocket.on('error', (msg) => {
                log('ERREUR GAME: ' + msg);
            });

            gameSocket.on('disconnect', () => {
                log('Déconnecté du game-service');
            });
        }

        // ========== LOBBY ACTIONS ==========

        function createLobby() {
            lobbySocket.emit('lobby:create', {
                gameMode: document.getElementById('createGameMode').value,
                gameType: document.getElementById('createGameType').value,
                maxUsers: parseInt(document.getElementById('createMaxUsers').value)
            });
        }

        function joinLobby() {
            const code = document.getElementById('joinCode').value.trim().toUpperCase();
            if (!code) { log('Entre un code lobby'); return; }
            currentLobbyId = code;
            lobbySocket.emit('lobby:join', { lobbyId: code });
        }

        function toggleReady() {
            if (!currentLobbyId) { log('Pas dans un lobby'); return; }
            lobbySocket.emit('lobby:ready', { lobbyId: currentLobbyId });
        }

        function startGame() {
            if (!currentLobbyId) { log('Pas dans un lobby'); return; }
            lobbySocket.emit('lobby:start', { lobbyId: currentLobbyId });
        }

        // ========== MATCHMAKING ==========

        function joinMatchmaking() {
            lobbySocket.emit('matchmaking:join', {
                gameMode: document.getElementById('mmGameMode').value,
                gameType: document.getElementById('mmGameType').value,
                maxUsers: parseInt(document.getElementById('mmMaxUsers').value)
            });
            log('Recherche de partie...');
        }

        function leaveMatchmaking() {
            lobbySocket.emit('matchmaking:leave');
            log('Recherche annulée');
        }

        // ========== GAME ACTIONS ==========

        function sendAction() {
            if (!gameSocket || !currentGameId) { log('Pas en partie'); return; }
            const actionType = document.getElementById('actionType').value;
            const target = document.getElementById('actionTarget').value;
            gameSocket.emit('game:action', {
                gameId: currentGameId,
                actionType: actionType,
                target: target
            });
        }

        function updateUI(gameStruct) {
            document.getElementById('currentPlayer').innerText =
                gameStruct.currentPlayer === userId ? '→ TON TOUR ←' : gameStruct.currentPlayer.substring(0, 8);
            document.getElementById('currentAction').innerText = gameStruct.currentAction;

            const me = gameStruct.players.find(p => p.id === userId);
            if (me) {
                document.getElementById('hand').innerText =
                    me.hand.map(c => '[' + c.value + ']').join(' ');
            }

            document.getElementById('middle').innerText =
                gameStruct.cardsInMiddle.map((c, i) =>
                    c.revealed ? i + ':[' + c.value + ']' : i + ':[?]'
                ).join(' ');

            document.getElementById('revealed').innerText =
                gameStruct.cardsRevealed.map(c => '[' + c.value + ']').join(' ');

            const playersList = gameStruct.players.map(p => {
                let status = p.connected ? '🟢' : (p.eliminated ? '❌' : '🟡');
                let isMe = p.id === userId ? ' (MOI)' : '';
                let isTurn = p.id === gameStruct.currentPlayer ? ' ◄' : '';
                return status + ' ' + p.id.substring(0, 8) + isMe + isTurn;
            }).join('\n');
            document.getElementById('playersList').innerText = playersList;
        }
    </script>
</body>
</html>
